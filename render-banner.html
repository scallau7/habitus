<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="robots" content="noindex"><title>Gráfico de funciones · Habitus</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
  body{margin:0;background:#3a3936;min-height:100vh;display:flex;flex-direction:column;
       align-items:center;justify-content:center;gap:26px;
       font-family:"Geist",system-ui,sans-serif;color:#e8e6e0}
  canvas{display:block;box-shadow:0 10px 40px rgba(0,0,0,.45);max-width:94vw;height:auto}
  a.bajar{background:#FAFAF8;color:#0A0A0A;text-decoration:none;font-weight:600;
          font-size:17px;padding:15px 30px;border-radius:99px}
  a.bajar:hover{opacity:.88}
  p{font-size:14px;color:#9d9a93;margin:0}
</style>
</head><body>
<canvas id="c" width="1024" height="500"></canvas>
<a class="bajar" id="bajar" download="grafico-funciones.png">Descargar el PNG · 1024 × 500</a>
<p>Se guarda en tu carpeta de Descargas. Ese archivo es el que subís a Play.</p>
<script>
(async function(){
  await document.fonts.load('600 76px Geist');
  await document.fonts.load('400 27px Geist');
  await document.fonts.load('600 27px Geist');
  await document.fonts.ready;
  const c=document.getElementById('c'), x=c.getContext('2d');
  const TINTA='#0A0A0A', PAPEL='#FAFAF8', GRIS='#6B6B68';
  x.fillStyle=PAPEL; x.fillRect(0,0,1024,500);

  const S=86, e=S/100;
  x.font='600 76px Geist, sans-serif';
  const w=x.measureText('habitus').width;
  const total=S+22+w, x0=(1024-total)/2, yc=232;

  x.strokeStyle=TINTA; x.lineWidth=8.5*e;
  x.beginPath(); x.arc(x0+50*e, yc, 36*e, 0, Math.PI*2); x.stroke();
  x.fillStyle=PAPEL; x.beginPath(); x.arc(x0+50*e, yc-36*e, 13.5*e, 0, Math.PI*2); x.fill();
  x.fillStyle=TINTA; x.beginPath(); x.arc(x0+50*e, yc-36*e, 10.5*e, 0, Math.PI*2); x.fill();

  x.fillStyle=TINTA; x.textBaseline='middle';
  x.fillText('habitus', x0+S+22, yc+2);

  const a='Tu constancia ', b='vale', p='.';
  x.font='400 27px Geist, sans-serif'; const wa=x.measureText(a).width, wp=x.measureText(p).width;
  x.font='600 27px Geist, sans-serif'; const wb=x.measureText(b).width;
  let lx=(1024-(wa+wb+wp))/2; const ly=338;
  x.font='400 27px Geist, sans-serif'; x.fillStyle=GRIS; x.fillText(a,lx,ly); lx+=wa;
  x.font='600 27px Geist, sans-serif'; x.fillStyle=TINTA; x.fillText(b,lx,ly); lx+=wb;
  x.font='400 27px Geist, sans-serif'; x.fillStyle=GRIS; x.fillText(p,lx,ly);

  document.getElementById('bajar').href = c.toDataURL('image/png');
})();
</script></body></html>
